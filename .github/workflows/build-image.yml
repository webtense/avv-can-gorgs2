name: Build Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular versión de build
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "build_id=${VERSION}-${SHA7}" >> "$GITHUB_OUTPUT"
          echo "immutable=v${VERSION}-${SHA7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_BUILD_ID=${{ steps.ver.outputs.build_id }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:manual-${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.immutable }}
